name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
# CI's release builds skip fat LTO (which linked every test binary on one core: 28 of the rust job's 35 minutes)
# and optimise for speed rather than size. They are for tests and checks only; nothing built here ships.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2   # the determinism check reads the wasm fingerprint with Bun
        with: { bun-version: 1.3.11 }
      - run: cargo test --workspace --release --locked   # full-game tests are slow unoptimised
      - run: "cargo test -p civ-core --features save --release --locked --lib save::"
      # Native and wasm32 must agree bit for bit. The runner is already linux/amd64
      # with glibc, so the script's Docker legs would only repeat the native one.
      - run: crates/civ-core/tools/check_determinism.sh
        env: { CHECK_DETERMINISM_DOCKER: "0" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack@0.13.1 }
      # Bun installs and runs everything, vite, vitest and svelte-check included (web/bunfig.toml): no Node
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run wasm   # web/src/engine/pkg is not in git
        working-directory: web
      - run: python3 tools/check_protocol.py
      - run: bun run test
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun run build
        working-directory: web
