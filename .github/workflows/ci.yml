name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
# CI's release builds skip fat LTO (which linked every test binary on one core: 28 of the rust job's 35 minutes)
# and optimise for speed rather than size. They are for tests and checks only; nothing built here ships.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
# Most pushes touch only the client. A job whose every input (sources, lockfile, toolchain, this file) matches a
# tree that already passed skips its work: the `passed` cache is written only after success, keyed by those inputs.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .passed
          key: rust-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', '.github/workflows/ci.yml') }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.passed.outputs.cache-hit != 'true'
        run: cargo test --workspace --release --locked   # full-game tests are slow unoptimised
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir .passed
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .passed, key: "${{ steps.passed.outputs.cache-primary-key }}" }
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .passed
          key: determinism-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', '.github/workflows/ci.yml') }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2   # the check reads the wasm fingerprint with Bun
        with: { bun-version: 1.3.11 }
      # Native and wasm32 must agree bit for bit. The runner is already linux/amd64
      # with glibc, so the script's Docker legs would only repeat the native one.
      - if: steps.passed.outputs.cache-hit != 'true'
        run: crates/civ-core/tools/check_determinism.sh
        env: { CHECK_DETERMINISM_DOCKER: "0" }
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir .passed
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .passed, key: "${{ steps.passed.outputs.cache-primary-key }}" }
  web:
    runs-on: ubuntu-latest
    # The tests are mostly art generation, bound by the runner's two cores: two shards halve them.
    # The first shard also runs the checks that need the whole client.
    strategy: { matrix: { shard: [1, 2] } }
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      # web/src/engine/pkg is not in git: the engine is built for the browser only when its sources change
      - id: wasm
        uses: actions/cache@v4
        with:
          path: web/src/engine/pkg
          key: wasm-${{ steps.toolchain.outputs.cachekey }}-wasm-pack-0.13.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**') }}
      - id: protocol
        uses: actions/cache/restore@v4
        with:
          path: .passed
          key: protocol-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'web/src/engine/generated/**', 'web/tools/export-rules.ts', 'content/art/needs.json', 'tools/check_protocol.py') }}
          lookup-only: true
      - if: steps.wasm.outputs.cache-hit != 'true' || (matrix.shard == 1 && steps.protocol.outputs.cache-hit != 'true')
        uses: Swatinem/rust-cache@v2
      - if: steps.wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with: { tool: wasm-pack@0.13.1 }
      # Bun installs and runs everything, vite, vitest and svelte-check included (web/bunfig.toml): no Node
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run ${{ steps.wasm.outputs.cache-hit == 'true' && 'rules' || 'wasm' }}   # wasm ends with rules
        working-directory: web
      - if: matrix.shard == 1 && steps.protocol.outputs.cache-hit != 'true'
        run: python3 tools/check_protocol.py && mkdir .passed
      - if: matrix.shard == 1 && steps.protocol.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: .passed, key: "${{ steps.protocol.outputs.cache-primary-key }}" }
      - run: bun run test --shard=${{ matrix.shard }}/2
        working-directory: web
      - if: matrix.shard == 1
        run: bun run check
        working-directory: web
      - if: matrix.shard == 1
        run: bun run build
        working-directory: web
