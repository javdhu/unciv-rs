name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
# CI's release builds skip fat LTO (which links every test binary on one core) and optimise for speed rather
# than size. They are for tests and checks only; nothing built here ships.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The Bevy client links against these on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      # The Unciv rulesets the tests use as fixtures are fetched, not vendored (NOTICE).
      - run: crates/civ-core/tools/fetch_unciv_rulesets.sh
      - run: cargo test --workspace --release --locked   # full-game tests are slow unoptimised
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2   # the check reads the wasm fingerprint with Bun
        with: { bun-version: 1.3.11 }
      - run: crates/civ-core/tools/fetch_unciv_rulesets.sh
      # Native and wasm32 must agree bit for bit. The runner is already linux/amd64
      # with glibc, so the script's Docker legs would only repeat the native one.
      - run: crates/civ-core/tools/check_determinism.sh
        env: { CHECK_DETERMINISM_DOCKER: "0" }
