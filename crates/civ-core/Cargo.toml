[package]
name = "civ-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/javdhu/unciv-rs"

# The core is deliberately dependency-free: rules must be deterministic and
# portable to wasm32 without dragging a runtime along.
[lib]
# rlib for tests and downstream crates; cdylib so the wasm build exports
# civ_core_fingerprint for the determinism check.
crate-type = ["rlib", "cdylib"]

[features]
# Off by default: the rules core must stay dependency-free and wasm-portable.
serde = ["dep:serde"]
save = ["serde", "dep:serde_json", "dep:postcard"]
# The shadow check for live sight (`world::fog::audit`), for tests that play whole games.
sight-audit = []

[dependencies]
serde = { version = "1", optional = true, features = ["derive", "rc"] }
serde_json = { version = "1", optional = true }
# Snapshots' binary form: a stable, documented wire format (MIT OR Apache-2.0).
postcard = { version = "1.1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
# `world::world` holds the `World` type itself. Renaming either to dodge the
# lint would make the module layout worse, not better.
module_inception = "allow"
