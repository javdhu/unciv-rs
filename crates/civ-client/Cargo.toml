[package]
name = "civ-client"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/javdhu/unciv-rs"
publish = false
description = "The Bevy client: draws a seat's view of a match and sends its orders"

[features]
# Wasm graphics backends, one per wasm build: Bevy's `webgpu` overrides `webgl2` (docs/VISUAL-SPEC.md, V5).
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
civ-sim = { path = "../civ-sim", default-features = false }
bevy = { version = "0.20", default-features = false, features = [
    "default_app", "std", "bevy_winit", "default_font", "3d_bevy_render", "ui_api", "ui_bevy_render", "scene",
    "picking", "bevy_ui_widgets",
] }
# Lock-free in both directions: the browser's main thread must never wait on a lock.
concurrent-queue = "2"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["multi_threaded"] }
# Rooms (docs/ROOMS-SPEC.md, R6): synchronous HTTP and WebSocket on their own threads, no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope",
    "Window", "Location", "WebSocket", "MessageEvent", "CloseEvent", "Event", "Request", "RequestInit",
    "RequestCredentials", "Response", "Headers", "Performance", "History", "EventTarget",
    "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode",
    "IdbObjectStore", "Storage",
] }
# PNG encoding for review shots posted from the page; the same version Bevy uses.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Rooms tests run a real civ-server in-process (tests/rooms.rs).
civ-server = { path = "../civ-server" }
axum = "=0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tempfile = "3"

