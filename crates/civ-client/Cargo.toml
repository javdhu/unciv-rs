[package]
name = "civ-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Bevy client: draws a seat's view of a match and sends its orders"

[features]
# Wasm graphics backends, one per wasm build: Bevy's `webgpu` overrides `webgl2` (docs/VISUAL-SPEC.md, V5).
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]

[dependencies]
civ-sim = { path = "../civ-sim", default-features = false }
bevy = { version = "0.20", default-features = false, features = [
    "default_app", "std", "bevy_winit", "default_font", "3d_bevy_render", "ui_api", "ui_bevy_render", "scene",
    "picking",
] }
# Lock-free in both directions: the browser's main thread must never wait on a lock.
concurrent-queue = "2"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope"] }
