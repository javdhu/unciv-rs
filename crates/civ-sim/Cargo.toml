[package]
name = "civ-sim"
version = "0.1.0"
edition = "2021"
description = "civ.game engine facade: game setup, player views and turns over civ-core, for wasm and native"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine is developed in the Unciv-master repository; pinned by path until its public API settles.
civ-core = { path = "../../../../Downloads/Unciv-master/civ-core-rs", features = ["save"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
schemars = "1.2.2"
wasm-bindgen = "=0.2.126"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
