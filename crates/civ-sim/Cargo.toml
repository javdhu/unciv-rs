[package]
name = "civ-sim"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/javdhu/unciv-rs"
description = "Engine facade: game setup, player views and turns over civ-core, for wasm and native"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The rules engine lives beside this crate.
civ-core = { path = "../civ-core", features = ["save"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
schemars = "1.2.2"
# The browser bindings (`HostedGame`, `ruleTables`), behind `js`.
wasm-bindgen = { version = "0.2.126", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["js"]
# wasm-bindgen exports for a JavaScript host. A Rust client that links this crate turns it off.
js = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dev-dependencies]
# Tests audit live sight against its plain recomputation (`civ_core::world::fog::audit`).
civ-core = { path = "../civ-core", features = ["save", "sight-audit"] }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
